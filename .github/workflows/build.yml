name: Build yt-dlp GUI App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # キャッシュを有効にすると2回目以降が速くなります

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 requests pyinstaller

    - name: Download External Binaries (yt-dlp & ffmpeg)
      shell: pwsh
      run: |
        # yt-dlp.exe のダウンロード
        Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"
        
        # ffmpeg.exe のダウンロード
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
        Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "ffmpeg.exe"

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        # 'pyinstaller' の代わりに 'python -m PyInstaller' を使用
        python -m PyInstaller --onefile --noconsole --icon=Yt_Downloader_256.ico `
          --add-binary "yt-dlp.exe;." `
          --add-binary "ffmpeg.exe;." `
          --name "YT-Downloader" `
          downloader.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YT-Downloader-Windows
        path: dist/*.exe
