name: Build

# 手動実行、または Release が公開された時のみ動く
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flet（画面部品のテストに使用）
        run: pip install "flet==0.28.3"
      - name: テスト（core / manager / 画面のレイアウト検査）
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            artifact: YT-Downloader-windows
          - os: ubuntu-22.04
            target: linux
            artifact: YT-Downloader-linux
    runs-on: ${{ matrix.os }}
    env:
      # Windows の既定コードページ(cp1252)では flet/rich の記号出力で落ちるため UTF-8 を強制
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux 依存パッケージ
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 依存関係のインストール
        run: |
          pip install "flet[cli]==0.28.3"
          pip install -r requirements.txt

      - name: バージョンを埋め込む（Release 時はタグから）
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "__version__ = \"$VERSION\"" > src/app_version.py
          sed -i -E "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          cat src/app_version.py

      - name: 同梱ツールの取得（yt-dlp / ffmpeg / Deno）
        run: python tools/fetch_bin.py --target ${{ matrix.target }} --out bin_cache

      - name: ビルド
        run: flet build ${{ matrix.target }}

      - name: 同梱ツールを bin/ に配置（Windows）
        if: matrix.target == 'windows'
        shell: pwsh
        run: Copy-Item -Recurse bin_cache build/windows/bin

      - name: 同梱ツールと補助ファイルを配置（Linux）
        if: matrix.target == 'linux'
        run: |
          cp -r bin_cache build/linux/bin
          cp packaging/install.sh packaging/yt-downloader.desktop packaging/yt-downloader.png build/linux/
          chmod +x build/linux/install.sh build/linux/bin/*

      - name: パッケージ化（Windows）
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: パッケージ化（Linux）
        if: matrix.target == 'linux'
        run: cd build/linux && zip -r -y "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .

      - name: Actions の成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

      - name: Release に添付（Release 公開時のみ）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.artifact }}.*
